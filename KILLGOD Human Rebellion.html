function phaseForLevel(lvl){ if(lvl<=25) return 1; if(lvl<=50) return 2; if(lvl<=75) return 3; return 4; }

function newGameState(){
  return {
    level:1, hp:100, maxHp:100, mp:50, maxMp:50,
    baseAttack:15, baseMagic:20, gold:30, skillPoints:1,
    demonAllied:false, weapon:"Rusty Sword", armor:"Tattered Cloak",
    inventory:{"Minor Mana Potion":2, "Health Draught":2},
    skillsUnlocked:[], attrPoints:0, phoenixUsed:false,
    lorefound:{}, enemy:null, enemyStatus:{}, playerStatus:{}, inCombat:false,
    faction:{"Heavenly Host":-50, "Prophets":-30, "Nephilim":10, "Demonic Legions":50}
  };
}
let gs = newGameState();
function totalAttack(){ return gs.baseAttack + WEAPONS[gs.weapon].atk; }
function totalMagic(){ return gs.baseMagic + (gs.demonAllied?10:0); }
function totalMaxHp(){ return gs.maxHp + ARMORS[gs.armor].hp; }

function logMsg(msg){ document.getElementById('log').innerText = msg; }
function updateBars(){
  const e = gs.enemy;
  document.getElementById('bars').innerHTML =
    '<div>HP ' + gs.hp + '/' + totalMaxHp() + '</div>' +
    '<div class="bar"><div id="hpfill" class="fill" style="width:' + Math.max(0,gs.hp/totalMaxHp()*100) + '%"></div></div>' +
    '<div>MP ' + gs.mp + '/' + gs.maxMp + '</div>' +
    '<div class="bar"><div id="mpfill" class="fill" style="width:' + Math.max(0,gs.mp/gs.maxMp*100) + '%"></div></div>' +
    (e ? ('<div style="margin-top:6px">' + e.name + ' — ' + e.hp + '/' + e.maxHp + '</div>' +
    '<div class="bar"><div id="ehpfill" class="fill" style="width:' + Math.max(0,e.hp/e.maxHp*100) + '%"></div></div>') : '') +
    '<div style="margin-top:6px">Lv.' + gs.level + ' | Gold: ' + gs.gold + ' | SP: ' + gs.skillPoints + '</div>';
}

function checkLevelUp(){
  if(gs.level < 100){
    gs.level += 1;
    gs.skillPoints += 1;
    gs.hp = totalMaxHp();
    gs.mp = gs.maxMp;
    if(MILESTONE_EVENTS[gs.level] && !gs.lorefound[gs.level]){
      const ev = MILESTONE_EVENTS[gs.level];
      gs.lorefound[gs.level] = true;
      if(ev.reward.gold) gs.gold += ev.reward.gold;
      if(ev.reward.attr_points) gs.attrPoints += ev.reward.attr_points;
      if(ev.reward.skill_points) gs.skillPoints += ev.reward.skill_points;
      if(ev.reward.max_hp) gs.maxHp += ev.reward.max_hp;
      if(ev.reward.max_mp) gs.maxMp += ev.reward.max_mp;
      setTimeout(function(){ openPanel('lore', ev); }, 400);
    }
  }
}

const WORLD_SIZE = 60;
const TILE = 8;
function buildTerrain(){
  const heights = [];
  for(let x=0;x<WORLD_SIZE;x++){
    heights.push([]);
    for(let z=0;z<WORLD_SIZE;z++){
      const h = Math.sin(x*0.1)*Math.cos(z*0.12)*3 + Math.sin(x*0.25+z*0.18)*2 + Math.sin(x*0.05+z*0.08)*5;
      heights[x].push(h);
    }
  }
  return heights;
}
function elementAt(x,z){
  const idx = Math.floor((Math.sin(x*0.13)+Math.cos(z*0.17)+2) / 4 * ELEMENTS.length) % ELEMENTS.length;
  return ELEMENTS[idx];
}

let scene, camera, renderer, playerRig, playerBody, playerYaw=0, playerPitch=0;
let terrainHeights;
const WORLD = { creatures: [] };
let moveVec = {x:0,y:0};
const clock = new THREE.Clock();
let animTime = 0;
let lungeState = null; // {target, progress, origin}

function heightAt(wx, wz){
  const gx = Math.max(0, Math.min(WORLD_SIZE-1, Math.round(wx/TILE + WORLD_SIZE/2)));
  const gz = Math.max(0, Math.min(WORLD_SIZE-1, Math.round(wz/TILE + WORLD_SIZE/2)));
  return terrainHeights[gx][gz];
}

function initWorld(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x1a1e2e);
  scene.fog = new THREE.Fog(0x1a1e2e, 60, 420);

  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  document.getElementById('game').prepend(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.1);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff2cc, 1.2);
  sun.position.set(100,150,50);
  scene.add(sun);

  terrainHeights = buildTerrain();
  const geo = new THREE.PlaneGeometry(WORLD_SIZE*TILE, WORLD_SIZE*TILE, WORLD_SIZE-1, WORLD_SIZE-1);
  geo.rotateX(-Math.PI/2);
  const posAttr = geo.attributes.position;
  const colors = [];
  const regionColorArr = REGIONS.map(r=>new THREE.Color(r.ground));
  for(let i=0;i<posAttr.count;i++){
    const gx = i % WORLD_SIZE, gz = Math.floor(i / WORLD_SIZE);
    const h = terrainHeights[gx][gz];
    posAttr.setY(i, h*3);
    const regionIdx = Math.min(3, Math.floor(gx / (WORLD_SIZE/4)));
    const c = regionColorArr[regionIdx].clone();
    const el = elementAt(gx,gz);
    const elCol = new THREE.Color(ELEMENT_COLORS[el]);
    c.lerp(elCol, 0.12);
    colors.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({vertexColors:true, flatShading:false, roughness:0.9});
  const terrainMesh = new THREE.Mesh(geo, mat);
  scene.add(terrainMesh);

  REGIONS.forEach((r,i)=>{
    const gx = Math.floor((i+0.5) * (WORLD_SIZE/4));
    const wx = (gx - WORLD_SIZE/2) * TILE;
    const h = terrainHeights[gx][Math.floor(WORLD_SIZE/2)];
    addLabel(r.name, wx, h*3+20, 0, '#ffe066');
  });

  // ---- Playable character: more lifelike humanoid rig (head, torso, arms, legs) ----
  playerRig = new THREE.Group();
  playerBody = buildHumanoid(0xffe066, 0x332200, 1.0);
  playerRig.add(playerBody.group);
  playerRig.position.set(0, 0, 0);
  scene.add(playerRig);

  spawnCreatures();
  document.getElementById('loadingMsg').style.display='none';
  setupControls();
  animate();
}

function buildHumanoid(color, emissive, scale){
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color, emissive, emissiveIntensity:0.25, roughness:0.6});
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(1.4*scale,2.6*scale,4,8), mat);
  torso.position.y = 4.2*scale;
  const head = new THREE.Mesh(new THREE.SphereGeometry(1.1*scale,10,10), mat);
  head.position.y = 6.6*scale;
  const armGeo = new THREE.CapsuleGeometry(0.45*scale,2.2*scale,4,6);
  const armL = new THREE.Mesh(armGeo, mat); armL.position.set(-1.9*scale,4.3*scale,0); armL.rotation.z=0.15;
  const armR = new THREE.Mesh(armGeo, mat); armR.position.set(1.9*scale,4.3*scale,0); armR.rotation.z=-0.15;
  const legGeo = new THREE.CapsuleGeometry(0.55*scale,2.4*scale,4,6);
  const legL = new THREE.Mesh(legGeo, mat); legL.position.set(-0.7*scale,1.4*scale,0);
  const legR = new THREE.Mesh(legGeo, mat); legR.position.set(0.7*scale,1.4*scale,0);
  group.add(torso, head, armL, armR, legL, legR);
  return {group, torso, head, armL, armR, legL, legR, mat};
}

function addLabel(text, x, y, z, color){
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 48px Georgia';
  ctx.fillStyle = color;
  ctx.textAlign = 'center';
  ctx.fillText(text, 256, 70);
  const tex = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({map:tex, transparent:true});
  const sprite = new THREE.Sprite(spriteMat);
  sprite.position.set(x,y,z);
  sprite.scale.set(60,15,1);
  scene.add(sprite);
}

function spawnCreatures(){
  WORLD.creatures.length = 0;
  scene.children = scene.children.filter(o => !o.userData.isCreature);
  for(let i=0;i<20;i++){
    const gx = Math.floor(Math.random()*WORLD_SIZE);
    const gz = Math.floor(Math.random()*WORLD_SIZE);
    const phase = Math.min(4, Math.floor(gx/(WORLD_SIZE/4)) + 1);
    const pool = CREATURE_TYPES[phase];
    const t = pool[Math.floor(Math.random()*pool.length)];
    const wx = (gx - WORLD_SIZE/2) * TILE;
    const wz = (gz - WORLD_SIZE/2) * TILE;
    const h = terrainHeights[gx][gz]*3;
    const scale = 1 + gs.level*0.02;
    const creature = {
      id: 'c'+i+'_'+Date.now(), name:t.name, hp: Math.floor(t.hp*scale), maxHp: Math.floor(t.hp*scale),
      atk: Math.floor(t.atk*scale), ability: t.ability||null, element: t.element,
      x: wx, z: wz, alive: true, isBoss:false, bobPhase: Math.random()*6.28
    };
    const bodyRig = buildHumanoid(ELEMENT_COLORS[t.element]||0xff2b2b, ELEMENT_COLORS[t.element]||0xff2b2b, 0.85);
    bodyRig.group.position.set(wx, h, wz);
    bodyRig.group.userData.isCreature = true;
    bodyRig.group.userData.id = creature.id;
    creature.rig = bodyRig;
    scene.add(bodyRig.group);
    WORLD.creatures.push(creature);
  }
}

function screenPosFor(worldPos){
  const v = worldPos.clone().project(camera);
  return { x: (v.x*0.5+0.5)*window.innerWidth, y: (-v.y*0.5+0.5)*window.innerHeight };
}

function spawnDamageNumber(worldPos, text, color){
  const sp = screenPosFor(worldPos);
  const el = document.createElement('div');
  el.className = 'dmgnum';
  el.style.left = sp.x + 'px';
  el.style.top = sp.y + 'px';
  el.style.color = color || '#fff';
  el.innerText = text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 900);
}
function spawnBloodSplat(worldPos){
  const sp = screenPosFor(worldPos);
  const el = document.createElement('div');
  el.className = 'bloodsplat';
  el.style.left = (sp.x-60) + 'px';
  el.style.top = (sp.y-60) + 'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 650);
}

function startEncounter(creature){
  if(gs.inCombat) return;
  gs.inCombat = true;
  gs.enemy = creature;
  gs.enemyStatus = {};
  gs.playerStatus = {};
  gs.phoenixUsed = false;
  document.getElementById('atkBtn').innerText = 'FIGHT';
  logMsg((FIXED_BOSSES[gs.level] && FIXED_BOSSES[gs.level].name===creature.name) ? FIXED_BOSSES[gs.level].intro : ("A " + creature.name + " attacks!"));
  updateBars();
  openPanel('combat');
}

function killCreatureForever(creature){
  creature.alive = false;
  creature.hp = 0;
  if(creature.rig){
    scene.remove(creature.rig.group);
    creature.rig.group.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
    creature.rig = null;
  }
  const idx = WORLD.creatures.indexOf(creature);
  if(idx !== -1) WORLD.creatures.splice(idx, 1);
}

function triggerLunge(creature){
  if(!creature.rig) return;
  const worldPos = creature.rig.group.position.clone();
  worldPos.y += 5;
  lungeState = {progress:0, targetPos:worldPos.clone(), origin:playerRig.position.clone()};
}

function playerAttack(kind, skillId){
  if(!gs.inCombat) return;
  const e = gs.enemy;
  let dmg = 0, msg = "";
  triggerLunge(e);
  if(kind === 'melee'){
    dmg = totalAttack() + Math.floor(Math.random()*8);
    msg = "You strike for " + dmg + " damage!";
  } else if(kind === 'magic'){
    if(gs.mp < 8){ logMsg("Not enough mana!"); return; }
    gs.mp -= 8;
    dmg = Math.floor(totalMagic()*1.2) + Math.floor(Math.random()*6);
    msg = "Arcane bolt hits for " + dmg + " damage!";
  } else if(kind === 'skill'){
    const s = SKILLS[skillId];
    if(gs.mp < s.mp_cost){ logMsg("Not enough mana!"); return; }
    gs.mp -= s.mp_cost;
    const base = s.branch === 'melee' ? totalAttack() : totalMagic();
    dmg = Math.floor(base * s.power_mult);
    msg = s.name + " deals " + dmg + " damage!";
    if(s.burn) gs.enemyStatus.burn = 3;
    if(s.stun && Math.random()<0.4) gs.enemyStatus.stun = 2;
  } else if(kind === 'item'){ useItem(skillId); return; }
  e.hp = Math.max(0, e.hp - dmg);
  if(e.rig){
    const wp = e.rig.group.position.clone(); wp.y += 6;
    spawnDamageNumber(wp, '-'+dmg, '#ff5050');
    spawnBloodSplat(wp);
  }
  logMsg(msg);
  updateBars();
  if(e.hp <= 0){ return winCombat(); }
  setTimeout(enemyTurn, 700);
}

function enemyTurn(){
  const e = gs.enemy;
  if(gs.enemyStatus.stun && gs.enemyStatus.stun > 0){ gs.enemyStatus.stun -= 1; logMsg(e.name+" is stunned and cannot act!"); updateBars(); return; }
  if(gs.enemyStatus.burn && gs.enemyStatus.burn > 0){
    e.hp = Math.max(0,e.hp-12); gs.enemyStatus.burn -= 1;
    if(e.rig){ const wp=e.rig.group.position.clone(); wp.y+=6; spawnDamageNumber(wp,'-12 burn','#ff8c2b'); }
    if(e.hp<=0){ return winCombat(); }
  }
  let dmg = Math.max(1, e.atk - Math.floor(ARMORS[gs.armor].hp/10));
  gs.hp -= dmg;
  spawnDamageNumber(new THREE.Vector3(playerRig.position.x, playerRig.position.y+7, playerRig.position.z), '-'+dmg, '#ff2b2b');
  spawnBloodSplat(new THREE.Vector3(playerRig.position.x, playerRig.position.y+5, playerRig.position.z));
  let extra = "";
  if(e.ability === 'poison' && Math.random()<0.3){ gs.playerStatus.poison=3; extra=" You've been poisoned!"; }
  if(e.ability === 'burn' && Math.random()<0.3){ gs.playerStatus.burn=2; extra=" You're burning!"; }
  if(gs.playerStatus.poison>0){ gs.hp -= 6; gs.playerStatus.poison-=1; extra+=" Poison festers."; }
  logMsg(e.name + " hits you for " + dmg + "." + extra);
  updateBars();
  if(gs.hp <= 0){
    if(gs.inventory["Phoenix Down"] > 0 && !gs.phoenixUsed){
      gs.inventory["Phoenix Down"] -= 1; gs.phoenixUsed = true;
      gs.hp = Math.floor(totalMaxHp()*0.4);
      logMsg("Phoenix Down saves you from death!"); updateBars();
    } else { loseCombat(); }
  }
}

function useItem(name){
  const item = CONSUMABLES[name];
  if(!gs.inventory[name] || gs.inventory[name]<=0) return;
  gs.inventory[name] -= 1;
  if(item.type==='hp') gs.hp = Math.min(totalMaxHp(), gs.hp+item.amount);
  if(item.type==='mp') gs.mp = Math.min(gs.maxMp, gs.mp+item.amount);
  if(item.type==='full'){ gs.hp = totalMaxHp(); gs.mp = gs.maxMp; }
  if(item.type==='cleanse') gs.playerStatus = {};
  logMsg("Used " + name + "."); updateBars();
  if(gs.inCombat) setTimeout(enemyTurn, 600);
}

function winCombat(){
  gs.inCombat = false;
  const goldGain = gs.enemy.isBoss ? 200 : 20 + gs.level*2;
  gs.gold += goldGain;
  logMsg("Victory! " + gs.enemy.name + " falls. (+" + goldGain + " gold)");
  killCreatureForever(gs.enemy);
  gs.enemy = null;
  document.getElementById('atkBtn').innerText = 'NEAR';
  checkLevelUp();
  updateBars();
  setTimeout(closePanel, 1200);
  if(WORLD.creatures.length < 6) spawnCreatures();
}

function loseCombat(){
  gs.inCombat = false;
  gs.hp = Math.floor(totalMaxHp()*0.3);
  gs.enemy = null;
  logMsg("You have fallen... but crawl back to the Sanctuary, bloodied.");
  document.getElementById('atkBtn').innerText = 'NEAR';
  updateBars();
  setTimeout(closePanel, 1500);
}

function openPanel(kind, extra){
  const ov = document.getElementById('overlay');
  const body = document.getElementById('overlayBody');
  ov.style.display = 'flex';
  if(kind === 'combat'){
    let itemsHtml = '';
    for(const n in gs.inventory){ if(gs.inventory[n]>0){ itemsHtml += '<div class="row"><div class="info">'+n+' x'+gs.inventory[n]+'</div><button class="act" onclick="playerAttack(\\'item\\',\\''+n+'\\')">Use</button></div>'; } }
    let skillsHtml = '';
    gs.skillsUnlocked.forEach(function(id){ const s=SKILLS[id]; skillsHtml += '<div class="row"><div class="info"><b>'+s.name+'</b> ('+s.mp_cost+' MP)</div><button class="act" onclick="playerAttack(\\'skill\\',\\''+id+'\\')">Use</button></div>'; });
    body.innerHTML = '<h2>⚔️ '+gs.enemy.name+'</h2>'+
      '<div class="row"><div class="info">Melee Strike</div><button class="act" onclick="playerAttack(\\'melee\\')">Attack</button></div>'+
      '<div class="row"><div class="info">Arcane Bolt (8 MP)</div><button class="act" onclick="playerAttack(\\'magic\\')">Cast</button></div>'+
      skillsHtml + '<h2 style="margin-top:10px">Items</h2>' + (itemsHtml||'<p>No items.</p>') +
      '<button class="act" style="margin-top:12px" onclick="closePanel()">Flee (return later)</button>';
  } else if(kind === 'skills'){
    let html = '<h2>🌟 Skill Tree (SP: '+gs.skillPoints+')</h2>';
    const branchNames = {melee:'⚔️ Melee', magic:'✨ Arcane', demonic:'🔥 Demonic (pact req.)'};
    ['melee','magic','demonic'].forEach(function(branch){
      html += '<h3>'+branchNames[branch]+'</h3>';
      for(const id in SKILLS){
        const s = SKILLS[id]; if(s.branch!==branch) continue;
        const unlocked = gs.skillsUnlocked.indexOf(id)!==-1;
        const lvlOk = gs.level>=s.unlock_level;
        const pactOk = !s.requires_pact || gs.demonAllied;
        const canLearn = lvlOk && pactOk && gs.skillPoints>=s.cost_sp && !unlocked;
        html += '<div class="row"><div class="info"><b>'+s.name+'</b> — '+s.desc+' ('+s.cost_sp+' SP, Lv.'+s.unlock_level+')</div><button class="act" '+(!canLearn?'disabled':'')+' onclick="learnSkill(\\''+id+'\\')">'+(unlocked?'Learned':'Learn')+'</button></div>';
      }
    });
    body.innerHTML = html;
  } else if(kind === 'shop'){
    let html = '<h2>🛒 Sanctuary Shop (Gold: '+gs.gold+')</h2><h3>Weapons</h3>';
    for(const n in WEAPONS){ const d=WEAPONS[n]; const owned=gs.weapon===n, locked=gs.level<d.req;
      html += '<div class="row"><div class="info"><b>'+n+'</b> ATK+'+d.atk+' — '+d.cost+'g, Req Lv.'+d.req+'</div><button class="act" '+(owned||locked?'disabled':'')+' onclick="buyWeapon(\\''+n+'\\')">'+(owned?'Equipped':'Buy')+'</button></div>'; }
    html += '<h3>Armor</h3>';
    for(const n in ARMORS){ const d=ARMORS[n]; const owned=gs.armor===n, locked=gs.level<d.req;
      html += '<div class="row"><div class="info"><b>'+n+'</b> HP+'+d.hp+' — '+d.cost+'g, Req Lv.'+d.req+'</div><button class="act" '+(owned||locked?'disabled':'')+' onclick="buyArmor(\\''+n+'\\')">'+(owned?'Equipped':'Buy')+'</button></div>'; }
    html += '<h3>Consumables</h3>';
    for(const n in CONSUMABLES){ const d=CONSUMABLES[n];
      html += '<div class="row"><div class="info"><b>'+n+'</b> — '+d.desc+' ('+d.cost+'g)</div><button class="act" onclick="buyItem(\\''+n+'\\')">Buy</button></div>'; }
    html += '<h3>Rest</h3><div class="row"><div class="info">Full heal, 20 gold</div><button class="act" onclick="restHeal()">Rest</button></div>';
    body.innerHTML = html;
  } else if(kind === 'inv'){
    let html = '<h2>🎒 Inventory</h2>'; let any=false;
    for(const n in gs.inventory){ if(gs.inventory[n]>0){ any=true; html += '<div class="row"><div class="info">'+n+' x'+gs.inventory[n]+'</div></div>'; } }
    body.innerHTML = html + (any?'':'<p>Empty.</p>');
  } else if(kind === 'lore'){
    if(extra){
      body.innerHTML = '<h2>'+extra.title+'</h2><p>'+extra.lore+'</p><button class="act" onclick="openPanel(\\'lore\\')">See all secrets</button>';
    } else {
      let html=''; let count=0, total=0;
      for(const lvl in MILESTONE_EVENTS){ total++; if(gs.lorefound[lvl]){ count++; const ev=MILESTONE_EVENTS[lvl]; html += '<p><b>'+ev.title+'</b><br>'+ev.lore+'</p><hr>'; } }
      body.innerHTML = '<h2>📜 Secrets & Lore ('+count+'/'+total+')</h2>' + (html || '<p>The road hides more than monsters. Keep climbing.</p>');
    }
  }
}
function closePanel(){ document.getElementById('overlay').style.display='none'; }
function learnSkill(id){ const s=SKILLS[id]; if(gs.skillPoints>=s.cost_sp && gs.skillsUnlocked.indexOf(id)===-1){ gs.skillPoints-=s.cost_sp; gs.skillsUnlocked.push(id); openPanel('skills'); } }
function buyWeapon(n){ const d=WEAPONS[n]; if(gs.gold>=d.cost){ gs.gold-=d.cost; gs.weapon=n; openPanel('shop'); updateBars(); } }
function buyArmor(n){ const d=ARMORS[n]; if(gs.gold>=d.cost){ gs.gold-=d.cost; gs.armor=n; openPanel('shop'); updateBars(); } }
function buyItem(n){ const d=CONSUMABLES[n]; if(gs.gold>=d.cost){ gs.gold-=d.cost; gs.inventory[n]=(gs.inventory[n]||0)+1; openPanel('shop'); updateBars(); } }
function restHeal(){ if(gs.gold>=20){ gs.gold-=20; gs.hp=totalMaxHp(); gs.mp=gs.maxMp; gs.playerStatus={}; openPanel('shop'); updateBars(); } }

function setupControls(){
  const joy = document.getElementById('joystick');
  const knob = document.getElementById('joystick-knob');
  let active=false, start={x:0,y:0};
  const reset = function(){ knob.style.left='35px'; knob.style.top='35px'; moveVec={x:0,y:0}; };
  joy.addEventListener('touchstart', function(e){ active=true; const r=joy.getBoundingClientRect(); start={x:r.left+r.width/2,y:r.top+r.height/2}; });
  joy.addEventListener('touchmove', function(e){
    if(!active) return;
    const t=e.touches[0]; let dx=t.clientX-start.x, dy=t.clientY-start.y;
    const max=45; const dist=Math.min(max, Math.hypot(dx,dy)); const ang=Math.atan2(dy,dx);
    const kx=Math.cos(ang)*dist, ky=Math.sin(ang)*dist;
    knob.style.left=(35+kx)+'px'; knob.style.top=(35+ky)+'px';
    moveVec={x:Math.cos(ang)*(dist/max), y:Math.sin(ang)*(dist/max)};
    e.preventDefault();
  }, {passive:false});
  joy.addEventListener('touchend', function(){ active=false; reset(); });

  const lookpad = document.getElementById('lookpad');
  let lastX=0, lastY=0, looking=false;
  lookpad.addEventListener('touchstart', function(e){ looking=true; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; });
  lookpad.addEventListener('touchmove', function(e){
    if(!looking) return;
    const t=e.touches[0]; const dx=t.clientX-lastX, dy=t.clientY-lastY;
    playerYaw -= dx*0.004; playerPitch = Math.max(-0.5, Math.min(0.8, playerPitch - dy*0.003));
    lastX=t.clientX; lastY=t.clientY; e.preventDefault();
  }, {passive:false});
  lookpad.addEventListener('touchend', function(){ looking=false; });

  const keys = {};
  window.addEventListener('keydown', function(e){ keys[e.key]=true; });
  window.addEventListener('keyup', function(e){ keys[e.key]=false; });
  window.__keys = keys;

  // FIX: attack button is ALWAYS visible/clickable now -- no more chicken/egg deadlock
  document.getElementById('atkBtn').addEventListener('click', function(){
    if(gs.inCombat){ openPanel('combat'); return; }
    let nearest=null, nd=1e9;
    for(const c of WORLD.creatures){
      const dx=c.x-playerRig.position.x, dz=c.z-playerRig.position.z;
      const d=dx*dx+dz*dz;
      if(d<nd){ nd=d; nearest=c; }
    }
    if(nearest && nd < 30*30){ startEncounter(nearest); } else { logMsg("No enemies nearby. Explore to find one."); }
  });
  window.addEventListener('resize', function(){
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
}

function updateNearIndicator(){
  const btn = document.getElementById('atkBtn');
  if(gs.inCombat) return;
  let nd = 1e9;
  for(const c of WORLD.creatures){
    const dx=c.x-playerRig.position.x, dz=c.z-playerRig.position.z;
    nd = Math.min(nd, dx*dx+dz*dz);
  }
  if(nd < 30*30){ btn.classList.remove('faded'); } else { btn.classList.add('faded'); }
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  animTime += dt;
  const keys = window.__keys || {};
  let mx = moveVec.x, mz = moveVec.y;
  if(keys['ArrowLeft']||keys['a']) mx=-1; if(keys['ArrowRight']||keys['d']) mx=1;
  if(keys['ArrowUp']||keys['w']) mz=-1; if(keys['ArrowDown']||keys['s']) mz=1;

  const isMoving = (!gs.inCombat && (mx!==0 || mz!==0));
  if(isMoving){
    const speed = 26;
    const forward = new THREE.Vector3(Math.sin(playerYaw), 0, Math.cos(playerYaw));
    const right = new THREE.Vector3(Math.cos(playerYaw), 0, -Math.sin(playerYaw));
    const move = new THREE.Vector3();
    move.addScaledVector(right, mx*speed*dt);
    move.addScaledVector(forward, -mz*speed*dt);
    playerRig.position.add(move);
    playerRig.rotation.y = playerYaw;
    const h = heightAt(playerRig.position.x, playerRig.position.z);
    playerRig.position.y = h*3;
  }

  // idle breathing + walk-cycle animation for player
  if(playerBody){
    const walkPhase = animTime*8;
    if(isMoving){
      playerBody.legL.rotation.x = Math.sin(walkPhase)*0.6;
      playerBody.legR.rotation.x = -Math.sin(walkPhase)*0.6;
      playerBody.armL.rotation.x = -Math.sin(walkPhase)*0.5;
      playerBody.armR.rotation.x = Math.sin(walkPhase)*0.5;
    } else {
      playerBody.legL.rotation.x *= 0.8; playerBody.legR.rotation.x *= 0.8;
      playerBody.armL.rotation.x *= 0.8; playerBody.armR.rotation.x *= 0.8;
      playerBody.torso.position.y = 4.2 + Math.sin(animTime*2)*0.08;
      playerBody.head.position.y = 6.6 + Math.sin(animTime*2)*0.08;
    }
  }

  // lunge attack animation: player leaps toward target then snaps back
  if(lungeState){
    lungeState.progress += dt*3.2;
    const p = lungeState.progress;
    if(p < 1){
      const t = Math.sin(p*Math.PI);
      playerRig.position.lerpVectors(lungeState.origin, lungeState.targetPos.clone().setY(lungeState.origin.y), t*0.55);
    } else {
      playerRig.position.copy(lungeState.origin);
      lungeState = null;
    }
  }

  const camDist = 22, camHeight = 10 + playerPitch*15;
  const camX = playerRig.position.x - Math.sin(playerYaw)*camDist;
  const camZ = playerRig.position.z - Math.cos(playerYaw)*camDist;
  camera.position.set(camX, playerRig.position.y+camHeight, camZ);
  camera.lookAt(playerRig.position.x, playerRig.position.y+4, playerRig.position.z);

  // idle bob/sway animation for all creatures -- makes them feel alive, not static props
  WORLD.creatures.forEach(function(c){
    if(c.rig){
      c.rig.group.rotation.y += dt*0.3;
      const bob = Math.sin(animTime*2 + c.bobPhase)*0.4;
      c.rig.group.position.y = heightAt(c.x, c.z)*3 + bob*0 ;
      c.rig.torso.position.y = 4.2*0.85 + bob;
      c.rig.head.position.y = 6.6*0.85 + bob;
      c.rig.armL.rotation.z = 0.15 + Math.sin(animTime*1.5+c.bobPhase)*0.15;
      c.rig.armR.rotation.z = -0.15 - Math.sin(animTime*1.5+c.bobPhase)*0.15;
    }
  });

  updateNearIndicator();

  const region = REGIONS[Math.min(3, Math.max(0, Math.floor((playerRig.position.x/TILE + WORLD_SIZE/2) / (WORLD_SIZE/4))))];
  if(!gs.inCombat) document.getElementById('ui').innerHTML = '<b>'+region.name+'</b><br>'+region.desc;

  renderer.render(scene, camera);
}

updateBars();
initWorld();
</script>
