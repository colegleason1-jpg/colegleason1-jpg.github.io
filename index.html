<style>

  button.act{background:#5a2a10;color:#e0c48c;border:1px solid #ff8c4b;border-radius:6px;
    padding:8px 10px;font-size:13px;}
  button.act:disabled{opacity:0.4;}
  #closeOverlay{position:absolute;top:10px;right:14px;background:none;border:none;color:#e0c48c;

  #bars{position:absolute;top:0;right:0;width:220px;padding:8px;color:#fff;font-size:12px;z-index:5;
    text-shadow:0 0 4px #000;}
  .bar{height:10px;background:#222;border-radius:4px;overflow:hidden;margin-bottom:4px;}
  .fill{height:100%;}
  #hpfill{background:#ff4b4b;} #mpfill{background:#4b9bff;} #ehpfill{background:#ff8c4b;}
  #menuBtns{position:absolute;top:8px;right:0;left:0;display:flex;justify-content:center;gap:6px;z-index:15;}

  #log{position:absolute;bottom:130px;left:0;right:0;text-align:center;color:#fff;font-size:12px;
    z-index:5;text-shadow:0 0 4px #000;pointer-events:none;padding:0 20px;}
  #errbox{position:absolute;bottom:0;left:0;right:0;background:#400;color:#fff;font-size:11px;
    padding:6px;z-index:100;display:none;white-space:pre-wrap;}
</style>

function phaseForLevel(lvl){
  if(lvl<=25) return 1;
  if(lvl<=50) return 2;
  if(lvl<=75) return 3;
  return 4;
}

function newGameState(){
  return {
    level:1, hp:100, maxHp:100, mp:50, maxMp:50,
    baseAttack:15, baseMagic:20, gold:30, skillPoints:1,
    demonAllied:false, weapon:"Rusty Sword", armor:"Tattered Cloak",
    inventory:{"Minor Mana Potion":2, "Health Draught":2},
    skillsUnlocked:[], attrPoints:0, phoenixUsed:false,
    lorefound:{}, enemy:null, enemyStatus:{}, playerStatus:{}, inCombat:false
  };
}
let gs = newGameState();

function totalAttack(){ return gs.baseAttack + WEAPONS[gs.weapon].atk; }
function totalMagic(){ return gs.baseMagic + (gs.demonAllied?10:0); }
function totalMaxHp(){ return gs.maxHp + ARMORS[gs.armor].hp; }

function getEnemyForLevel(lvl){
  if(FIXED_BOSSES[lvl]){
    const b = FIXED_BOSSES[lvl];
    return {name:b.name, hp:b.hp, maxHp:b.hp, atk:b.atk, ability:b.ability, isBoss:true, intro:b.intro};
  }
  const phase = phaseForLevel(lvl);
  const pool = ENEMY_POOLS[phase];
  const t = pool[Math.floor(Math.random()*pool.length)];
  const scale = 1 + lvl*0.045;
  return {name:"Lvl " + lvl + " " + t.name, hp:Math.floor(t.hp*scale), maxHp:Math.floor(t.hp*scale),
    atk:Math.floor(t.atk*scale), ability:t.ability||null, isBoss:false};
}

function logMsg(msg){
  document.getElementById('log').innerText = msg;
}

function updateBars(){
  const e = gs.enemy;
  document.getElementById('bars').innerHTML =
    '<div>HP ' + gs.hp + '/' + totalMaxHp() + '</div>' +
    '<div class="bar"><div id="hpfill" class="fill" style="width:' + Math.max(0,gs.hp/totalMaxHp()*100) + '%"></div></div>' +
    '<div>MP ' + gs.mp + '/' + gs.maxMp + '</div>' +
    '<div class="bar"><div id="mpfill" class="fill" style="width:' + Math.max(0,gs.mp/gs.maxMp*100) + '%"></div></div>' +
    (e ? ('<div style="margin-top:6px">' + e.name + ' — ' + e.hp + '/' + e.maxHp + '</div>' +
    '<div class="bar"><div id="ehpfill" class="fill" style="width:' + Math.max(0,e.hp/e.maxHp*100) + '%"></div></div>') : '') +
    '<div style="margin-top:6px">Lv.' + gs.level + ' | Gold: ' + gs.gold + ' | SP: ' + gs.skillPoints + '</div>';
}

function checkLevelUp(){
  if(gs.level < 100){
    gs.level += 1;
    gs.skillPoints += 1;
    gs.hp = totalMaxHp();
    gs.mp = gs.maxMp;
    if(MILESTONE_EVENTS[gs.level] && !gs.lorefound[gs.level]){
      const ev = MILESTONE_EVENTS[gs.level];
      gs.lorefound[gs.level] = true;
      if(ev.reward.gold) gs.gold += ev.reward.gold;
      if(ev.reward.attr_points) gs.attrPoints += ev.reward.attr_points;
      if(ev.reward.skill_points) gs.skillPoints += ev.reward.skill_points;
      if(ev.reward.max_hp) gs.maxHp += ev.reward.max_hp;
      if(ev.reward.max_mp) gs.maxMp += ev.reward.max_mp;
      setTimeout(function(){ openPanel('lore', ev); }, 400);
    }
    return true;
  }
  return false;
}

function startEncounter(){
  if(gs.inCombat) return;
  gs.inCombat = true;
  gs.enemy = getEnemyForLevel(gs.level);
  gs.enemyStatus = {};
  gs.playerStatus = {};
  gs.phoenixUsed = false;
  document.getElementById('atkBtn').style.display='flex';
  logMsg(gs.enemy.intro ? gs.enemy.intro : ("A " + gs.enemy.name + " attacks!"));
  updateBars();
  openPanel('combat');
}

function playerAttack(kind, skillId){
  if(!gs.inCombat) return;
  const e = gs.enemy;
  let dmg = 0, msg = "";
  if(kind === 'melee'){
    dmg = totalAttack() + Math.floor(Math.random()*8);
    msg = "You strike for " + dmg + " damage!";
  } else if(kind === 'magic'){
    if(gs.mp < 8){ logMsg("Not enough mana!"); return; }
    gs.mp -= 8;
    dmg = Math.floor(totalMagic()*1.2) + Math.floor(Math.random()*6);
    msg = "Arcane bolt hits for " + dmg + " damage!";
  } else if(kind === 'skill'){
    const s = SKILLS[skillId];
    if(gs.mp < s.mp_cost){ logMsg("Not enough mana!"); return; }
    gs.mp -= s.mp_cost;
    const base = s.branch === 'melee' ? totalAttack() : totalMagic();
    dmg = Math.floor(base * s.power_mult);
    msg = s.name + " deals " + dmg + " damage!";
    if(s.burn) gs.enemyStatus.burn = 3;
    if(s.stun && Math.random()<0.4) gs.enemyStatus.stun = 2;
  } else if(kind === 'item'){
    useItem(skillId);
    return;
  }
  e.hp -= dmg;
  logMsg(msg);
  updateBars();
  if(e.hp <= 0){ return winCombat(); }
  setTimeout(enemyTurn, 700);
}

function enemyTurn(){
  const e = gs.enemy;
  if(gs.enemyStatus.stun && gs.enemyStatus.stun > 0){
    gs.enemyStatus.stun -= 1;
    logMsg(e.name + " is stunned and cannot act!");
    updateBars();
    return;
  }
  if(gs.enemyStatus.burn && gs.enemyStatus.burn > 0){
    e.hp -= 12; gs.enemyStatus.burn -= 1;
    if(e.hp<=0){ return winCombat(); }
  }
  let dmg = Math.max(1, e.atk - Math.floor(ARMORS[gs.armor].hp/10));
  gs.hp -= dmg;
  let extra = "";
  if(e.ability === 'poison' && Math.random()<0.3){ gs.playerStatus.poison=3; extra=" You've been poisoned!"; }
  if(e.ability === 'burn' && Math.random()<0.3){ gs.playerStatus.burn=2; extra=" You're burning!"; }
  if(gs.playerStatus.poison>0){ gs.hp -= 6; gs.playerStatus.poison-=1; extra+=" Poison festers."; }
  logMsg(e.name + " hits you for " + dmg + "." + extra);
  updateBars();
  if(gs.hp <= 0){
    if(gs.inventory["Phoenix Down"] > 0 && !gs.phoenixUsed){
      gs.inventory["Phoenix Down"] -= 1;
      gs.phoenixUsed = true;
      gs.hp = Math.floor(totalMaxHp()*0.4);
      logMsg("Phoenix Down saves you from death!");
      updateBars();
    } else {
      loseCombat();
    }
  }
}

function useItem(name){
  const item = CONSUMABLES[name];
  if(!gs.inventory[name] || gs.inventory[name]<=0) return;
  gs.inventory[name] -= 1;
  if(item.type==='hp') gs.hp = Math.min(totalMaxHp(), gs.hp+item.amount);
  if(item.type==='mp') gs.mp = Math.min(gs.maxMp, gs.mp+item.amount);
  if(item.type==='full'){ gs.hp = totalMaxHp(); gs.mp = gs.maxMp; }
  if(item.type==='cleanse') gs.playerStatus = {};
  logMsg("Used " + name + ".");
  updateBars();
  if(gs.inCombat) setTimeout(enemyTurn, 600);
}

function winCombat(){
  gs.inCombat = false;
  const goldGain = gs.enemy.isBoss ? 200 : 20 + gs.level*2;
  gs.gold += goldGain;
  logMsg("Victory! " + gs.enemy.name + " falls. (+" + goldGain + " gold)");
  gs.enemy = null;
  document.getElementById('atkBtn').style.display='none';
  checkLevelUp();
  updateBars();
  setTimeout(closePanel, 1200);
}

function loseCombat(){
  gs.inCombat = false;
  gs.hp = Math.floor(totalMaxHp()*0.3);
  gs.enemy = null;
  logMsg("You have fallen... but crawl back to the Sanctuary, bloodied.");
  document.getElementById('atkBtn').style.display='none';
  updateBars();
  setTimeout(closePanel, 1500);
}

function openPanel(kind, extra){
  const ov = document.getElementById('overlay');
  const body = document.getElementById('overlayBody');
  ov.style.display = 'flex';
  if(kind === 'combat'){
    let itemsHtml = '';
    for(const n in gs.inventory){
      if(gs.inventory[n] > 0){
        itemsHtml += '<div class="row"><div class="info">' + n + ' x' + gs.inventory[n] + '</div><button class="act" onclick="playerAttack(\\'item\\',\\'' + n + '\\')">Use</button></div>';
      }
    }
    let skillsHtml = '';
    gs.skillsUnlocked.forEach(function(id){
      const s = SKILLS[id];
      skillsHtml += '<div class="row"><div class="info"><b>' + s.name + '</b> (' + s.mp_cost + ' MP)</div><button class="act" onclick="playerAttack(\\'skill\\',\\'' + id + '\\')">Use</button></div>';
    });
    body.innerHTML = '<h2>⚔️ ' + gs.enemy.name + '</h2>' +
      '<div class="row"><div class="info">Melee Strike</div><button class="act" onclick="playerAttack(\\'melee\\')">Attack</button></div>' +
      '<div class="row"><div class="info">Arcane Bolt (8 MP)</div><button class="act" onclick="playerAttack(\\'magic\\')">Cast</button></div>' +
      skillsHtml +
      '<h2 style="margin-top:10px">Items</h2>' +
      (itemsHtml || '<p>No items.</p>') +
      '<button class="act" style="margin-top:12px" onclick="closePanel()">Flee (return later)</button>';
  } else if(kind === 'skills'){
    let html = '<h2>🌟 Skill Tree (SP: ' + gs.skillPoints + ')</h2>';
    const branchNames = {melee:'⚔️ Melee', magic:'✨ Arcane', demonic:'🔥 Demonic (pact req.)'};
    ['melee','magic','demonic'].forEach(function(branch){
      html += '<h3>' + branchNames[branch] + '</h3>';
      for(const id in SKILLS){
        const s = SKILLS[id];
        if(s.branch !== branch) continue;
        const unlocked = gs.skillsUnlocked.indexOf(id) !== -1;
        const lvlOk = gs.level >= s.unlock_level;
        const pactOk = !s.requires_pact || gs.demonAllied;
        const canLearn = lvlOk && pactOk && gs.skillPoints >= s.cost_sp && !unlocked;
        html += '<div class="row"><div class="info"><b>' + s.name + '</b> — ' + s.desc + ' (' + s.cost_sp + ' SP, Lv.' + s.unlock_level + ')</div>' +
          '<button class="act" ' + (!canLearn?'disabled':'') + ' onclick="learnSkill(\\'' + id + '\\')">' + (unlocked?'Learned':'Learn') + '</button></div>';
      }
    });
    body.innerHTML = html;
  } else if(kind === 'shop'){
    let html = '<h2>🛒 Sanctuary Shop (Gold: ' + gs.gold + ')</h2><h3>Weapons</h3>';
    for(const n in WEAPONS){
      const d = WEAPONS[n];
      const owned = gs.weapon===n, locked = gs.level<d.req;
      html += '<div class="row"><div class="info"><b>' + n + '</b> ATK+' + d.atk + ' — ' + d.cost + 'g, Req Lv.' + d.req + '</div>' +
        '<button class="act" ' + (owned||locked?'disabled':'') + ' onclick="buyWeapon(\\'' + n + '\\')">' + (owned?'Equipped':'Buy') + '</button></div>';
    }
    html += '<h3>Armor</h3>';
    for(const n in ARMORS){
      const d = ARMORS[n];
      const owned = gs.armor===n, locked = gs.level<d.req;
      html += '<div class="row"><div class="info"><b>' + n + '</b> HP+' + d.hp + ' — ' + d.cost + 'g, Req Lv.' + d.req + '</div>' +
        '<button class="act" ' + (owned||locked?'disabled':'') + ' onclick="buyArmor(\\'' + n + '\\')">' + (owned?'Equipped':'Buy') + '</button></div>';
    }
    html += '<h3>Consumables</h3>';
    for(const n in CONSUMABLES){
      const d = CONSUMABLES[n];
      html += '<div class="row"><div class="info"><b>' + n + '</b> — ' + d.desc + ' (' + d.cost + 'g)</div>' +
        '<button class="act" onclick="buyItem(\\'' + n + '\\')">Buy</button></div>';
    }
    html += '<h3>Rest</h3><div class="row"><div class="info">Full heal, 20 gold</div><button class="act" onclick="restHeal()">Rest</button></div>';
    body.innerHTML = html;
  } else if(kind === 'inv'){
    let html = '<h2>🎒 Inventory</h2>';
    let any = false;
    for(const n in gs.inventory){
      if(gs.inventory[n] > 0){ any = true; html += '<div class="row"><div class="info">' + n + ' x' + gs.inventory[n] + '</div></div>'; }
    }
    body.innerHTML = html + (any ? '' : '<p>Empty.</p>');
  } else if(kind === 'lore'){
    if(extra){
      body.innerHTML = '<h2>' + extra.title + '</h2><p>' + extra.lore + '</p><button class="act" onclick="openPanel(\\'lore\\')">See all secrets</button>';
    } else {
      let html = '';
      let count = 0, total = 0;
      for(const lvl in MILESTONE_EVENTS){
        total++;
        if(gs.lorefound[lvl]){ count++; const ev = MILESTONE_EVENTS[lvl]; html += '<p><b>' + ev.title + '</b><br>' + ev.lore + '</p><hr>'; }
      }
      body.innerHTML = '<h2>📜 Secrets & Lore (' + count + '/' + total + ')</h2>' + (html || '<p>The road hides more than monsters. Keep climbing.</p>');
    }
  }
}
function closePanel(){ document.getElementById('overlay').style.display='none'; }

function learnSkill(id){
  const s = SKILLS[id];
  if(gs.skillPoints>=s.cost_sp && gs.skillsUnlocked.indexOf(id)===-1){
    gs.skillPoints -= s.cost_sp;
    gs.skillsUnlocked.push(id);
    openPanel('skills');
  }
}
function buyWeapon(n){ const d=WEAPONS[n]; if(gs.gold>=d.cost){ gs.gold-=d.cost; gs.weapon=n; openPanel('shop'); updateBars(); } }
function buyArmor(n){ const d=ARMORS[n]; if(gs.gold>=d.cost){ gs.gold-=d.cost; gs.armor=n; openPanel('shop'); updateBars(); } }
function buyItem(n){ const d=CONSUMABLES[n]; if(gs.gold>=d.cost){ gs.gold-=d.cost; gs.inventory[n]=(gs.inventory[n]||0)+1; openPanel('shop'); updateBars(); } }
function restHeal(){ if(gs.gold>=20){ gs.gold-=20; gs.hp=totalMaxHp(); gs.mp=gs.maxMp; gs.playerStatus={}; openPanel('shop'); updateBars(); } }

class WorldScene extends Phaser.Scene {
  constructor(){ super("WorldScene"); }
  preload(){
    this.load.image('player', 'https://labs.phaser.io/assets/sprites/phaser-dude.png');
  }
  create(){
    this.currentRegion = REGIONS[0];
    this.cameras.main.setBackgroundColor(this.currentRegion.color);
    this.player = this.physics.add.sprite(400, 300, 'player');
    this.player.setCollideWorldBounds(true);
    this.physics.world.setBounds(0,0,3200,2400);
    this.cameras.main.setBounds(0,0,3200,2400);
    this.cameras.main.startFollow(this.player, true, 0.08, 0.08);

    this.regionZones = [];
    REGIONS.forEach((r,i)=>{
      const zx = 400 + i*700, zy = 300 + (i%2)*600;
      this.add.rectangle(zx, zy, 500, 400, r.color, 0.35);
      this.add.text(zx-100, zy-220, r.name, {fontSize:'16px', color:'#e0c48c'});
      this.regionZones.push({rect:new Phaser.Geom.Rectangle(zx-250,zy-200,500,400), region:r});
    });

    this.enemySprites = this.physics.add.group();
    for(let i=0;i<14;i++){
      const ex = Phaser.Math.Between(100,3100), ey = Phaser.Math.Between(100,2300);
      const dot = this.physics.add.sprite(ex,ey,'player').setTint(0xff4b4b).setScale(0.55);
      dot.regionIndex = Math.min(3, Math.floor(ex/800));
      this.enemySprites.add(dot);
    }
    this.physics.add.overlap(this.player, this.enemySprites, (p,e)=>{
      if(!gs.inCombat){ e.destroy(); startEncounter(); }
    });

    this.uiDiv = document.getElementById('ui');
    this.joyVec = {x:0,y:0};
    setupJoystick(this);
  }
  update(){
    const speed = 220;
    this.player.setVelocity(this.joyVec.x*speed, this.joyVec.y*speed);
    let region = this.currentRegion;
    for(const z of this.regionZones){
      if(Phaser.Geom.Rectangle.Contains(z.rect, this.player.x, this.player.y)){ region=z.region; break; }
    }
    this.currentRegion = region;
    if(!gs.inCombat){
      this.uiDiv.innerHTML = '<b>' + region.name + '</b><br>' + region.desc;
    }
  }
}

function setupJoystick(scene){
  const joy = document.getElementById('joystick');
  const knob = document.getElementById('joystick-knob');
  let active = false, start = {x:0,y:0};
  const reset = function(){ knob.style.left='35px'; knob.style.top='35px'; scene.joyVec={x:0,y:0}; };
  joy.addEventListener('touchstart', function(e){
    active=true; const r=joy.getBoundingClientRect();
    start={x:r.left+r.width/2, y:r.top+r.height/2};
  });
  joy.addEventListener('touchmove', function(e){
    if(!active) return;
    const t = e.touches[0];
    let dx = t.clientX-start.x, dy = t.clientY-start.y;
    const max = 45;
    const dist = Math.min(max, Math.hypot(dx,dy));
    const ang = Math.atan2(dy,dx);
    const kx = Math.cos(ang)*dist, ky = Math.sin(ang)*dist;
    knob.style.left = (35+kx)+'px'; knob.style.top = (35+ky)+'px';
    scene.joyVec = {x:Math.cos(ang)*(dist/max), y:Math.sin(ang)*(dist/max)};
    e.preventDefault();
  }, {passive:false});
  joy.addEventListener('touchend', function(){ active=false; reset(); });

  const keys = {};
  window.addEventListener('keydown', function(e){ keys[e.key]=true; });
  window.addEventListener('keyup', function(e){ keys[e.key]=false; });
  scene.events.on('update', function(){
    if(active) return;
    let x=0,y=0;
    if(keys['ArrowLeft']||keys['a']) x-=1;
    if(keys['ArrowRight']||keys['d']) x+=1;
    if(keys['ArrowUp']||keys['w']) y-=1;
    if(keys['ArrowDown']||keys['s']) y+=1;
    scene.joyVec = {x:x,y:y};
  });
}

document.getElementById('atkBtn').addEventListener('click', function(){
  if(gs.inCombat) openPanel('combat');
});
document.getElementById('atkBtn').style.display='none';

const config = {
  type: Phaser.AUTO,
  width: Math.min(window.innerWidth, 900),
  height: Math.min(window.innerHeight, 600),
  parent: 'game',
  physics: { default:'arcade', arcade:{ debug:false } },
  scene: [WorldScene]
};
new Phaser.Game(config);
updateBars();
</script>
